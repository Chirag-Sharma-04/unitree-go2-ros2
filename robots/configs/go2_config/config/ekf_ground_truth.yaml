ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    
    publish_tf: true
    publish_acceleration: false
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    
    # Configuration for ground truth odometry
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    
    odom0: /odom/ground_truth
    odom0_config: [true,  true,  false,  # x, y, z positions
                   false, false, true,   # roll, pitch, yaw orientations
                   true,  true,  false,  # x, y, z velocities
                   false, false, true,   # roll, pitch, yaw velocities
                   false, false, false]  # x, y, z accelerations
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    
    # IMU configuration
    imu0: /imu/data
    imu0_config: [false, false, false,  # x, y, z positions (not from IMU)
                  false, false, true,   # roll, pitch, yaw orientations (use yaw)
                  false, false, false,  # x, y, z velocities (not from IMU)
                  false, false, true,   # roll, pitch, yaw velocities (use yaw rate)
                  false, false, false]  # x, y, z accelerations (can enable if needed)
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    
    # Process noise covariance
